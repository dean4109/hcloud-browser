<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --bg: #121316;
    --panel: #202124;
    --text: #f1f3f4;
    --muted: #9aa0a6;
    --accent: #8ab4f8;
    --danger: #f28b82;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 32px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .edit-btn { background: none; border: 1px solid #3c4043; color: var(--accent);
    font-size: 18px; padding: 10px 22px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; height: 170px; border-radius: 18px; text-decoration: none;
    color: var(--text); background: var(--panel); font-size: 20px; font-weight: 600;
    letter-spacing: .2px; text-align: center; padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .08s ease; }
  .tile img { width: 88px; height: 88px; border-radius: 20px; object-fit: contain; }
  /* No icon available: fall back to a coloured name tile. */
  .tile.noicon { color: #fff; font-size: 26px; font-weight: 700; }
  .tile.noicon img { display: none; }
  .tile:active { transform: scale(.97); }
  .remove { display: none; position: absolute; top: -10px; right: -10px; width: 40px; height: 40px;
    border-radius: 50%; border: 0; background: var(--danger); color: #202124;
    font-size: 24px; font-weight: 700; line-height: 40px; }
  .editing .remove { display: block; }
  .editing .tile { animation: wiggle .25s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-.6deg); } to { transform: rotate(.6deg); } }
  .add-tile { display: none; height: 170px; border-radius: 18px; border: 2px dashed #5f6368;
    background: none; color: var(--muted); font-size: 22px; }
  .editing .add-tile { display: block; }
  form { display: none; margin-top: 28px; background: var(--panel); border-radius: 18px;
    padding: 24px; gap: 14px; flex-wrap: wrap; align-items: center; }
  form.open { display: flex; }
  form input { flex: 1 1 260px; font-size: 20px; padding: 14px 18px; border-radius: 12px;
    border: 1px solid #3c4043; background: #2b2c2f; color: var(--text); }
  form button { font-size: 20px; padding: 14px 26px; border-radius: 12px; border: 0;
    background: var(--accent); color: #202124; font-weight: 600; }
  form button.secondary { background: #3c4043; color: var(--text); }
  .reset { display: none; margin-top: 28px; background: none; border: 0;
    color: var(--muted); font-size: 16px; text-decoration: underline; }
  body.editing .reset { display: inline-block; }
  .note { margin-top: 40px; color: var(--muted); font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Watch</h1>
    <button class="edit-btn" id="edit">Edit</button>
  </header>

  <div class="grid" id="grid"></div>

  <form id="addForm" autocomplete="off">
    <input id="name" placeholder="Name (e.g. Crunchyroll)" required>
    <input id="url" placeholder="Web address (e.g. crunchyroll.com)" required>
    <button type="submit">Add</button>
    <button type="button" class="secondary" id="cancel">Cancel</button>
  </form>

  <button class="reset" id="reset">Restore default tiles</button>

  <p class="note">Streaming video only plays while parked. Some services may refuse to play in a
    browser; if one does, there’s nothing wrong with the car or the app.</p>
</main>

<script>
  const DEFAULTS = [
    { name: "YouTube",     url: "https://m.youtube.com/",         color: "#cc0000" },
    { name: "Netflix",     url: "https://www.netflix.com/browse", color: "#b20710" },
    { name: "Hulu",        url: "https://www.hulu.com/hub/home",  color: "#0b7a4b" },
    { name: "Disney+",     url: "https://www.disneyplus.com/",    color: "#0e2a6b" },
    { name: "HBO Max",     url: "https://www.hbomax.com/",        color: "#2a1a8c" },
    { name: "Prime Video", url: "https://www.primevideo.com/",    color: "#0f6fa8" },
    { name: "Peacock",     url: "https://www.peacocktv.com/",     color: "#3a3a3a" },
    { name: "Paramount+",  url: "https://www.paramountplus.com/", color: "#0052cc" },
    { name: "Apple TV",    url: "https://tv.apple.com/",          color: "#2b2b2b" },
    { name: "Twitch",      url: "https://www.twitch.tv/",         color: "#6441a5" },
    { name: "Plex",        url: "https://app.plex.tv/",           color: "#a8790a" }
  ];
  const PALETTE = ["#1a73e8", "#188038", "#c5221f", "#9334e6", "#e37400", "#007b83", "#b3261e", "#5f6368"];
  const KEY = "tiles.v1";

  // The service's own icon, as published on its website (fetched live, not stored in the app).
  function iconFor(url) {
    let host = "";
    try { host = new URL(url).hostname; } catch (e) {}
    return "https://www.google.com/s2/favicons?sz=256&domain=" + encodeURIComponent(host);
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }

  let tiles = load();
  const grid = document.getElementById("grid");
  const form = document.getElementById("addForm");

  function render() {
    grid.textContent = "";
    tiles.forEach((t, i) => {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = t.url;
      const img = document.createElement("img");
      img.alt = "";
      img.src = iconFor(t.url);
      img.addEventListener("error", () => {
        a.classList.add("noicon");
        a.style.background = t.color || PALETTE[i % PALETTE.length];
      });
      img.addEventListener("load", () => {
        // Google returns a tiny generic globe when a site has no icon; treat that as missing.
        if (img.naturalWidth < 32) img.dispatchEvent(new Event("error"));
      });
      const label = document.createElement("span");
      label.textContent = t.name;
      a.append(img, label);
      a.addEventListener("click", e => {
        if (document.body.classList.contains("editing")) e.preventDefault();
      });
      const x = document.createElement("button");
      x.className = "remove";
      x.setAttribute("aria-label", "Remove " + t.name);
      x.textContent = "×";
      x.addEventListener("click", e => {
        e.preventDefault(); e.stopPropagation();
        tiles.splice(i, 1); save(tiles); render();
      });
      a.appendChild(x);
      grid.appendChild(a);
    });
    const add = document.createElement("button");
    add.className = "add-tile";
    add.textContent = "+ Add";
    add.addEventListener("click", () => {
      form.classList.add("open");
      document.getElementById("name").focus();
    });
    grid.appendChild(add);
  }

  document.getElementById("edit").addEventListener("click", e => {
    const on = document.body.classList.toggle("editing");
    e.target.textContent = on ? "Done" : "Edit";
    if (!on) form.classList.remove("open");
  });

  document.getElementById("cancel").addEventListener("click", () => {
    form.classList.remove("open"); form.reset();
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    let url = document.getElementById("url").value.trim();
    if (!name || !url) return;
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    tiles.push({ name, url, color: PALETTE[tiles.length % PALETTE.length] });
    save(tiles); render();
    form.reset(); form.classList.remove("open");
  });

  document.getElementById("reset").addEventListener("click", () => {
    tiles = DEFAULTS.slice(); save(tiles); render();
  });

  render();
</script>
</body>
</html>
